<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Register - AegisChat</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-container">
  <div class="logo">
    <div class="logo-icon"></div>
    Aegis<span>Chat</span>
  </div>
  
  <h2>Create Account</h2>
  <p class="subtitle">Secure end-to-end encrypted messaging</p>
  
  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>
  
  <form id="registerForm">
    <div class="form-group">
      <label>Choose Your Avatar</label>
      <div class="avatar-grid" id="avatarGrid"></div>
      <input type="hidden" id="selectedAvatar" value="avatar1">
    </div>
    
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" required minlength="3" autocomplete="username">
    </div>
    
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password">
    </div>
    
    <button type="submit" class="btn">CREATE ACCOUNT</button>
  </form>
  
  <div class="switch-mode">
    Already have an account? <a href="/login">Login</a><br>
    <a href="/guide.html" style="margin-top:10px; display:inline-block;">📖 User Guide / Panduan</a>
  </div>
</div>

<script src="js/avatars.js"></script>
<script src="js/register.js?v=20260825a"></script>
<script src="js/password-toggle.js?v=20260825a"></script>

</body>
</html>
