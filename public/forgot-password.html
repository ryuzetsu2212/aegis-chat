<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Forgot Password - AegisChat</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-container">
  <div class="logo">
    <div class="logo-icon"></div>
    Aegis<span>Chat</span>
  </div>
  
  <h2>Forgot Password</h2>
  <p class="subtitle">Enter your email to receive OTP</p>
  
  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg" style="display:none; background:#10b981; color:#fff; padding:12px; margin-bottom:20px; text-align:center;"></div>
  
  <form id="forgotPasswordForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required autocomplete="email" placeholder="your@email.com">
    </div>
    
    <button type="submit" class="btn">SEND OTP</button>
  </form>
  
  <div class="switch-mode">
    Remember your password? <a href="/login">Login</a>
  </div>
</div>

<script src="js/forgot-password.js?v=20260825a"></script>

</body>
</html>
