<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password - AegisChat</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-container">
  <div class="logo">
    <div class="logo-icon"></div>
    Aegis<span>Chat</span>
  </div>
  
  <h2>Reset Password</h2>
  <p class="subtitle">Enter OTP and new password</p>
  
  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg" style="display:none; background:#10b981; color:#fff; padding:12px; margin-bottom:20px; text-align:center;"></div>
  
  <form id="resetPasswordForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required readonly style="background:#1a1a1a; cursor:not-allowed;">
    </div>
    
    <div class="form-group">
      <label>OTP Code</label>
      <input type="text" id="otp" required maxlength="6" placeholder="Enter 6-digit OTP">
    </div>
    
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">
    </div>
    
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
    </div>
    
    <button type="submit" class="btn">RESET PASSWORD</button>
  </form>
  
  <div class="switch-mode">
    <a href="/forgot-password">Resend OTP</a> | <a href="/login">Back to Login</a>
  </div>
</div>

<script src="js/dialog.js?v=20260824"></script>
<script src="js/reset-password.js?v=20260825a"></script>

</body>
</html>
